    start: 2026-10-10
    end: 2026-10-21
  - name: Diwali / Kali Puja
    start: 2026-11-01
    end: 2026-11-09
  - name: Christmas
    start: 2026-12-12
    end: 2026-12-25
  - name: Saraswati Puja
    start: 2027-02-01
    end: 2027-02-11
  - name: Eid
    start: 2027-03-03
    end: 2027-03-11
  - name: Pohela Boishakh
    start: 2027-04-07
