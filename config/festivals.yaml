# Upcoming festival windows used to scale reorder advice.
#
# Names must match the labels used in the 'Festival / Occasion' column of the
# Sales sheet, so the uplift learned from past sales can be applied.
#
# VERIFY THESE DATES. Several festivals follow the lunar calendar and move
# every year; the dates below are best estimates. A window runs from the
# start of the pre-festival shopping rush to the festival itself.
festivals:
