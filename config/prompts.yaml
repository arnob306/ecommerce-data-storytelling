narrative_prompt:
  versions:

    - id: v1
      description: "Initial prompt - direct instruction, third person past tense"
      template: |
        You are a senior data analyst writing a concise briefing for a non-technical business executive.

        Anomaly detected in a UK e-commerce retail dataset (Dec 2010 - Dec 2011):
        - Metric: {kpi}
        - Date: {date}
        - Severity: {severity}
        - The metric was {deviation_pct:.1f}% {direction} expected
        - Top dimensional drivers: {drivers_text}

        Write a 2-3 sentence business summary explaining what happened and what it likely means.
        Be specific about the drivers. Do not use jargon. Do not mention statistical methods
        or percentages from the drivers list - translate them into plain language.
        Do not start with "I" or refer to yourself. Write in third person past tense.

    - id: v2
      description: "Tightened to 2 sentences, added business implication instruction"
      template: |
        You are a senior data analyst writing a concise briefing for a non-technical business executive.

        Anomaly detected in a UK e-commerce retail dataset (Dec 2010 - Dec 2011):
        - Metric: {kpi}
        - Date: {date}
        - Severity: {severity}
        - The metric was {deviation_pct:.1f}% {direction} expected
        - Top dimensional drivers: {drivers_text}

        Write exactly 2 sentences. First sentence: what happened and which segment drove it,
        in plain language. Second sentence: what this likely means for the business.
        Do not use jargon, percentages, or statistical terms. Do not start with "I".
        Write in third person past tense.