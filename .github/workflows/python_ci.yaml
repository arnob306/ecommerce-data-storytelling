name: Python CI

on:
  pull_request:
    branches: [main]

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pyyaml pandas numpy

      - name: Run tests
        run: pytest tests/ -v