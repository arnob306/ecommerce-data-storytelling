name: dbt CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: analytics_user
          POSTGRES_PASSWORD: analytics_dev
          POSTGRES_DB: ecommerce_analytics
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install "dbt-core==1.9.0" "dbt-postgres==1.9.0"

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'PROFILE'
          ecommerce_analytics:
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: analytics_user
                password: analytics_dev
                dbname: ecommerce_analytics
                schema: analytics
            target: dev
          PROFILE

      - name: Run schema init
        env:
          PGPASSWORD: analytics_dev
        run: psql -h localhost -U analytics_user -d ecommerce_analytics -f sql/init.sql

      - name: dbt deps
        working-directory: ecommerce_analytics
        run: dbt deps

      - name: dbt compile
        working-directory: ecommerce_analytics
        run: dbt compile

      - name: dbt test (schema tests only)
        working-directory: ecommerce_analytics
        run: dbt test --select source:*